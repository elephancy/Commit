name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install deployment tooling
        run: npm ci --ignore-scripts --no-audit
      - name: Test contribution schedules and safe command exports
        run: python3 -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Test Ops deployment bootstrap
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination=coverage/lcov.info scripts/ops-deploy.test.mjs
      - name: Preserve commit-deployment coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-commit-deployment
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload commit-deployment coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true
      - name: Audit dependencies
        run: npm audit
