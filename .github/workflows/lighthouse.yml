name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "Logo.*"
      - "_headers"
      - "package.json"
      - ".github/lighthouseci.cjs"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "Logo.*"
      - "_headers"
      - "package.json"
      - ".github/lighthouseci.cjs"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify checked-in static assets (no build is required)
        run: |
          test -f index.html
          test -f styles.css
          node --check app.js
      - name: Audit local static pages
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          test -f index.html
          npx --yes --package=@lhci/cli@0.15.1 lhci autorun --config=./.github/lighthouseci.cjs
      - name: Preserve reports in the repository artifact store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lighthouse/
          retention-days: 1
          if-no-files-found: ignore
