name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "Logo.*"
      - "_headers"
      - "package.json"
      - ".github/lighthouseci.cjs"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "Logo.*"
      - "_headers"
      - "package.json"
      - ".github/lighthouseci.cjs"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify checked-in static assets (no build is required)
        run: |
          test -f index.html
          test -f styles.css
          node --check app.js
      - name: Audit local static pages
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          test -f index.html
          npx --yes --package=@lhci/cli@0.15.1 lhci autorun --config=./.github/lighthouseci.cjs
      - name: Preserve reports in the repository artifact store
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lighthouse/
          retention-days: 1
          if-no-files-found: ignore
